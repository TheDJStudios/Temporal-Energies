plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven {
        url = "https://theo.is-a.dev/maven/"
        content { includeGroup "dev.drtheo" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi "teamreborn:energy:${project.energy_version}"
    include "teamreborn:energy:${project.energy_version}"
    modCompileOnly("maven.modrinth:ait:${project.ait_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // Optional integrations. These APIs are compile-only and are never bundled.
    modCompileOnly "maven.modrinth:create-fabric:${project.create_version}"
    modCompileOnly "maven.modrinth:cc-tweaked:${project.cc_tweaked_version}"
    modCompileOnly "maven.modrinth:tardis-refined:${project.tardis_refined_version}"

    // Kept as compile-only because AiT and its dependencies are optional at runtime.
    modCompileOnly "maven.modrinth:amblekit:${project.amblekit_version}"
    modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    modCompileOnly "dev.drtheo:multidim:${project.multidim_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "ait_version", project.ait_version
    inputs.property "create_version", project.create_version
    inputs.property "cc_tweaked_version", project.cc_tweaked_version
    inputs.property "tardis_refined_version", project.tardis_refined_version
    inputs.property "tardis_refined_mod_version", project.tardis_refined_mod_version

    filesMatching("fabric.mod.json") {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            loader_version: project.loader_version,
            ait_version: project.ait_version,
            create_version: project.create_version,
            cc_tweaked_version: project.cc_tweaked_version,
            tardis_refined_mod_version: project.tardis_refined_mod_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

// Loom itself needs Java 21+, while Minecraft 1.20.1 should launch on Java 17.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

// Exercise real Fabric transactions without launching or modifying a game world.
tasks.register("fuelRegressionChecks", JavaExec) {
    dependsOn regressionClasses
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = "dev.paradoxutilities.tardis.TardisFuelStorageChecks"
    workingDir = layout.buildDirectory.dir("regression-checks").get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named("check") {
    dependsOn "fuelRegressionChecks"
}
